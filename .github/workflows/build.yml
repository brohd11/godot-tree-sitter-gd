name: build

# Shared GDExtension addon workflow, synced byte-identical from
# build.template.yml in the sh-templates submodule (render-gdext.sh --check gates
# drift). Edit the template, not this copy.
#
# Assumes the repo convention: SConstruct at the root, godot-cpp submodule,
# binaries land in bin/, and package.sh creates the configured release zip in
# dist/ from a Godot project tree staged in build/.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            scons_args: platform=macos
          - name: linux
            os: ubuntu-latest
            scons_args: platform=linux arch=x86_64
          - name: windows
            os: windows-latest
            scons_args: platform=windows arch=x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history so git describe sees tag refs on every build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Build (debug + release)
        run: |
          scons ${{ matrix.scons_args }} target=template_debug
          scons ${{ matrix.scons_args }} target=template_release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: bin/*
          if-no-files-found: error

  package:
    name: package addon
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # required to create the release on a tag push
    # Runs on a v* tag, or on a manual run (handy for producing a test zip).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        # submodules not needed: package.sh only copies the addon source folder
        # plus repo-root LICENSE/README + bin/

      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: Package
        run: ./package.sh

      # Upload the exact zip that a tag push publishes. The Actions artifact is
      # a generic container; the file inside keeps its configured release name.
      - name: Upload addon zip
        uses: actions/upload-artifact@v4
        with:
          name: addon-package
          path: dist/*.zip
          if-no-files-found: error

      # Tag pushes additionally publish a GitHub release with the zip attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
