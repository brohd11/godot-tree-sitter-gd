name: build

# Shared GDExtension addon workflow, synced byte-identical from
# build.template.yml in the install_scripts repo (render-gdext.sh --check gates
# drift). Edit the template, not this copy.
#
# Assumes the repo convention: SConstruct at the root, godot-cpp submodule,
# binaries land in bin/, and package.sh assembles build/ as a Godot project root.
# Zip/artifact names come from the repo name, so no per-repo config is needed.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            scons_args: platform=macos
          - name: linux
            os: ubuntu-latest
            scons_args: platform=linux arch=x86_64
          - name: windows
            os: windows-latest
            scons_args: platform=windows arch=x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history so git describe sees tag refs on every build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Build (debug + release)
        run: |
          scons ${{ matrix.scons_args }} target=template_debug
          scons ${{ matrix.scons_args }} target=template_release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: bin/*
          if-no-files-found: error

  package:
    name: package addon
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # required to create the release on a tag push
    # Runs on a v* tag, or on a manual run (handy for producing a test zip).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        # submodules not needed: package.sh only copies the addon source folder
        # plus repo-root LICENSE/README + bin/

      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: Package
        run: ./package.sh

      # package.sh emits a directory tree (build/ mirrors a Godot project root),
      # so zip it explicitly for the release. Zipping build/'s *contents* keeps
      # addons/ at the top level of the archive, matching what the run artifact
      # yields, so it still extracts straight over a Godot project root.
      - name: Zip addon
        run: |
          mkdir -p dist
          (cd build && zip -qr "../dist/${{ github.event.repository.name }}-${{ github.ref_name }}.zip" .)

      # Downloadable artifact on every packaging run - including manual
      # workflow_dispatch runs, which produce a test zip but no release.
      - name: Upload addon zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}
          path: build/
          if-no-files-found: error

      # Tag pushes additionally publish a GitHub release with the zip attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
